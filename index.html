<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>내 주변 네 가지</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel-2:#f1f3f6; --line:#e2e6ec;
  --tx:#141820; --tx-2:#5b6572; --tx-3:#8a94a3;
  --suyo:#e23e57; --dalin:#e08700; --cafe:#0f9488; --lotto:#6c5ce7;
  --shadow:0 6px 24px rgba(16,24,40,.12);
  --sheet-h:44vh;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --panel:#171b22; --panel-2:#1f242c; --line:#2a313b;
    --tx:#e8ecf2; --tx-2:#9aa4b2; --tx-3:#6b7684;
    --suyo:#ff6b7f; --dalin:#f5a623; --cafe:#2dc4b6; --lotto:#8f83ff;
    --shadow:0 6px 24px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --panel:#171b22; --panel-2:#1f242c; --line:#2a313b;
  --tx:#e8ecf2; --tx-2:#9aa4b2; --tx-3:#6b7684;
  --suyo:#ff6b7f; --dalin:#f5a623; --cafe:#2dc4b6; --lotto:#8f83ff;
  --shadow:0 6px 24px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--tx);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;
  overflow:hidden;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}

/* ---------- layout ---------- */
#app{display:flex;flex-direction:column;height:100dvh}
header{
  flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 12px 0;
}
.brandrow{display:flex;align-items:center;gap:10px}
.brand{font-size:16px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--tx-3);letter-spacing:0}
.searchwrap{flex:1;position:relative;min-width:0}
#q{
  width:100%;padding:9px 32px 9px 32px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel-2);font-size:14px;outline:none
}
#q:focus{border-color:var(--tx-3)}
.sicon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--tx-3);pointer-events:none;font-size:13px}
#qclear{position:absolute;right:6px;top:50%;transform:translateY(-50%);color:var(--tx-3);padding:4px 8px;display:none}

.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0 11px}
@media (min-width:820px){ .chips{flex-wrap:nowrap} }
.chip{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  flex:1 1 calc(50% - 3px);
  padding:7px 11px;border-radius:999px;border:1.5px solid var(--line);
  background:var(--panel-2);color:var(--tx-2);font-size:13px;font-weight:600;
  transition:background .15s,color .15s,border-color .15s
}
.chip .n{font-size:11px;font-weight:700;opacity:.65;font-variant-numeric:tabular-nums}
.chip[data-on="1"]{color:#fff;border-color:transparent}
.chip[data-on="1"] .n{opacity:.8}
.chip[data-k="suyo"][data-on="1"]{background:var(--suyo)}
.chip[data-k="dalin"][data-on="1"]{background:var(--dalin)}
.chip[data-k="cafe"][data-on="1"]{background:var(--cafe)}
.chip[data-k="lotto"][data-on="1"]{background:var(--lotto)}
.chip[data-on="0"][data-k="suyo"]{color:var(--suyo);border-color:var(--suyo)}
.chip[data-on="0"][data-k="dalin"]{color:var(--dalin);border-color:var(--dalin)}
.chip[data-on="0"][data-k="cafe"]{color:var(--cafe);border-color:var(--cafe)}
.chip[data-on="0"][data-k="lotto"]{color:var(--lotto);border-color:var(--lotto)}
.chip[data-on="0"]{background:transparent}

#mapwrap{flex:1;position:relative;min-height:0}
#map{position:absolute;inset:0}

.fabs{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:8px;z-index:3}
.fab{
  width:42px;height:42px;border-radius:12px;background:var(--panel);box-shadow:var(--shadow);
  display:grid;place-items:center;font-size:17px;border:1px solid var(--line)
}
.fab.on{background:var(--lotto);color:#fff;border-color:transparent}
#research{
  position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:4;
  padding:9px 15px;border-radius:999px;background:var(--panel);border:1px solid var(--line);
  box-shadow:var(--shadow);font-size:13px;font-weight:700;white-space:nowrap
}
#research[hidden]{display:none}
#radius{
  position:absolute;left:12px;top:12px;z-index:3;padding:8px 10px;border-radius:12px;
  background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);font-size:13px;font-weight:600
}

/* ---------- bottom sheet ---------- */
#sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:4;
  background:var(--panel);border-top:1px solid var(--line);
  border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(16,24,40,.14);
  height:var(--sheet-h);display:flex;flex-direction:column;
  transition:height .25s cubic-bezier(.4,0,.2,1);
  padding-bottom:env(safe-area-inset-bottom)
}
#sheet[data-state="peek"]{height:76px}
#sheet[data-state="full"]{height:calc(100% - 8px)}
.grab{flex:0 0 auto;padding:9px 0 4px;display:grid;place-items:center}
.grab i{display:block;width:40px;height:4px;border-radius:2px;background:var(--line)}
.sheethead{
  flex:0 0 auto;display:flex;align-items:baseline;gap:8px;padding:0 14px 9px;
  border-bottom:1px solid var(--line)
}
.sheethead b{font-size:14px}
.sheethead span{font-size:12px;color:var(--tx-3)}
#list{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.item{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:flex-start}
.item:active{background:var(--panel-2)}
.pin{flex:0 0 auto;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;color:#fff;margin-top:1px}
.pin.suyo{background:var(--suyo)} .pin.dalin{background:var(--dalin)}
.pin.cafe{background:var(--cafe)} .pin.lotto{background:var(--lotto)}
.itx{min-width:0;flex:1}
.itx .nm{font-weight:650;font-size:14.5px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.itx .sub{font-size:12px;color:var(--tx-2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.itx .meta{font-size:11.5px;color:var(--tx-3);margin-top:3px}
.dist{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--tx-2);font-variant-numeric:tabular-nums;margin-top:2px}
.credits{padding:16px 14px 26px;color:var(--tx-3);font-size:11px;line-height:1.75}
.credits b{color:var(--tx-2);font-size:11.5px}
.empty{padding:34px 20px;text-align:center;color:var(--tx-3);font-size:13.5px;line-height:1.7}

/* ---------- detail ---------- */
#detail{
  position:absolute;left:10px;right:10px;bottom:calc(var(--sheet-h) + 10px);z-index:5;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  padding:13px 14px;display:none
}
#detail.show{display:block}
#detail .dt{display:flex;align-items:center;gap:8px;margin-bottom:3px}
#detail .badge{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;color:#fff}
#detail h3{margin:0;font-size:16.5px;letter-spacing:-.02em}
#detail .daddr{font-size:12.5px;color:var(--tx-2);margin:5px 0 2px}
#detail .dmeta{font-size:12px;color:var(--tx-3)}
#detail .acts{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.act{padding:7px 11px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--tx);text-decoration:none}
#dclose{position:absolute;right:8px;top:7px;color:var(--tx-3);font-size:17px;padding:4px 8px}

/* ---------- setup / toast ---------- */
#setup{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;place-items:center;padding:22px;overflow:auto}
#setup.show{display:grid}
.card{max-width:420px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
.card h2{margin:0 0 6px;font-size:18px}
.card p{margin:0 0 14px;font-size:13.5px;color:var(--tx-2);line-height:1.65}
.card ol{margin:0 0 16px;padding-left:19px;font-size:13px;color:var(--tx-2);line-height:1.9}
.card code{background:var(--panel-2);padding:1px 5px;border-radius:4px;font-size:12px}
.card input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);margin-bottom:10px}
.card button{width:100%;padding:12px;border-radius:10px;background:var(--lotto);color:#fff;font-weight:700}
#toast{
  position:fixed;left:50%;bottom:calc(var(--sheet-h) + 22px);transform:translateX(-50%) translateY(8px);
  background:rgba(20,24,32,.92);color:#fff;padding:9px 15px;border-radius:999px;font-size:13px;
  z-index:30;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (min-width:820px){
  :root{--sheet-h:46vh}
  #sheet{left:auto;right:12px;bottom:12px;width:390px;border-radius:16px;border:1px solid var(--line);height:calc(100% - 24px)}
  #sheet[data-state="peek"]{height:76px}
  #sheet[data-state="full"]{height:calc(100% - 24px)}
  #detail{left:12px;right:auto;width:390px;bottom:12px}
  .fabs{right:414px}
  .chip{flex:0 0 auto}
  .brand small{display:inline;margin-left:6px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brandrow">
      <div class="brand">내 주변 네 가지<small>맛집·카페·로또 명당</small></div>
      <div class="searchwrap">
        <span class="sicon">⌕</span>
        <input id="q" type="search" placeholder="상호 검색" autocomplete="off" enterkeyhint="search">
        <button id="qclear" aria-label="지우기">✕</button>
      </div>
    </div>
    <div class="chips" id="chips"></div>
  </header>

  <div id="mapwrap">
    <div id="map"></div>
    <select id="radius">
      <option value="1000">반경 1km</option>
      <option value="2000" selected>반경 2km</option>
      <option value="3000">반경 3km</option>
      <option value="5000">반경 5km</option>
      <option value="0">서울 전체</option>
    </select>
    <button id="research" hidden>이 지역에서 다시 찾기</button>
    <div class="fabs">
      <button class="fab" id="locate" title="현위치">◎</button>
      <button class="fab" id="theme" title="화면 모드">◐</button>
    </div>

    <div id="detail">
      <button id="dclose">✕</button>
      <div class="dt"><span class="badge" id="dbadge"></span></div>
      <h3 id="dname"></h3>
      <div class="daddr" id="daddr"></div>
      <div class="dmeta" id="dmeta"></div>
      <div class="acts" id="dacts"></div>
    </div>

    <div id="sheet" data-state="half">
      <div class="grab" id="grab"><i></i></div>
      <div class="sheethead"><b id="cnt">—</b><span id="hint">가까운 순</span></div>
      <div id="list"></div>
    </div>
  </div>
</div>

<div id="setup">
  <div class="card">
    <h2>카카오맵 키가 필요해요</h2>
    <p>지도를 그리려면 카카오 개발자 <b>JavaScript 키</b>가 있어야 합니다. 한 번만 넣어두면 이 브라우저에 저장됩니다.</p>
    <ol>
      <li><code>developers.kakao.com</code> → 내 애플리케이션</li>
      <li>앱 키 → <b>JavaScript 키</b> 복사</li>
      <li>플랫폼 → Web → 사이트 도메인에 이 페이지 주소 등록</li>
    </ol>
    <input id="keyin" placeholder="JavaScript 키 붙여넣기" autocomplete="off">
    <button id="keysave">저장하고 시작</button>
  </div>
</div>

function dist(a,b,c,d){
  var R=6371000, t=Math.PI/180;
  var dLat=(c-a)*t, dLng=(d-b)*t;
  var s=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a*t)*Math.cos(c*t)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2*R*Math.asin(Math.sqrt(s));
}

       textAlign:"center",lineHeight:"38px",fontSize:"12px",fontWeight:"700"},
      {width:"46px",height:"46px",background:"rgba(226,62,87,.88)",borderRadius:"23px",color:"#fff",
       textAlign:"center",lineHeight:"46px",fontSize:"13px",fontWeight:"700"},
      {width:"56px",height:"56px",background:"rgba(15,148,136,.9)",borderRadius:"28px",color:"#fff",
       textAlign:"center",lineHeight:"56px",fontSize:"14px",fontWeight:"700"}
    ]
  });

  var imgs={};
  ORDER.forEach(function(k){ imgs[k]=markerImage(CATS[k].color); });

  PLACES.forEach(function(p){
    var m=new kakao.maps.Marker({
      position:new kakao.maps.LatLng(p.lat,p.lng), image:imgs[p.k], title:p.name
    });
    kakao.maps.event.addListener(m,"click",function(){ select(p,true); });
    p._m=m; markers.push(m);
  });

  kakao.maps.event.addListener(map,"dragend",onMapMove);
  kakao.maps.event.addListener(map,"zoom_changed",onMapMove);

  researchBtn=document.getElementById("research");
  researchBtn.textContent="이 지역에서 다시 찾기";
  researchBtn.addEventListener("click",researchHere);

  ready=true;
  locate(true);
  refresh();
}

var moveT, researchBtn;
function onMapMove(){
  clearTimeout(moveT);
  moveT=setTimeout(function(){
    if(!researchBtn) return;
    var c=map.getCenter();
    var gap=dist(state.center.lat,state.center.lng,c.getLat(),c.getLng());
    researchBtn.hidden = gap < 400;
  },200);
}
function researchHere(){
  var c=map.getCenter();
  state.center={lat:c.getLat(),lng:c.getLng()};
  state.me=null;
  document.getElementById("locate").classList.remove("on");
  researchBtn.hidden=true;
  refresh();
}

/* ====== 현위치 ====== */
function locate(silent){
  if(!navigator.geolocation){ if(!silent) toast("이 브라우저는 위치를 지원하지 않아요"); return; }
  var btn=document.getElementById("locate");
  btn.textContent="…";
  navigator.geolocation.getCurrentPosition(function(pos){
    btn.textContent="◎"; btn.classList.add("on");
    state.me={lat:pos.coords.latitude,lng:pos.coords.longitude};
    state.center={lat:state.me.lat,lng:state.me.lng};
    var ll=new kakao.maps.LatLng(state.me.lat,state.me.lng);
    map.setCenter(ll);
    if(map.getLevel()>5) map.setLevel(5);
    if(meMarker) meMarker.setMap(null);
    var svg='<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"><circle cx="11" cy="11" r="6" fill="#2b7fff" stroke="#fff" stroke-width="3"/></svg>';
    meMarker=new kakao.maps.Marker({position:ll,map:map,zIndex:9,
      image:new kakao.maps.MarkerImage("data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(svg),
        new kakao.maps.Size(22,22),{offset:new kakao.maps.Point(11,11)})});
    if(researchBtn) researchBtn.hidden=true;
    refresh();
  },function(){
    btn.textContent="◎";
    if(!silent) toast("위치를 가져오지 못했어요. 브라우저 위치 권한을 확인해 주세요");
  },{enableHighAccuracy:true,timeout:8000,maximumAge:60000});
}
document.getElementById("locate").addEventListener("click",function(){ locate(false); });

/* ====== 필터 & 렌더 ====== */
function currentList(){
  var cx=state.center.lat, cy=state.center.lng, r=state.radius;
  var q=state.q.toLowerCase();
  var out=[];
  for(var i=0;i<PLACES.length;i++){
    var p=PLACES[i];
    if(!state.on[p.k]) continue;
    if(q && p.name.toLowerCase().indexOf(q)<0 && p.addr.toLowerCase().indexOf(q)<0) continue;
    p.d=dist(cx,cy,p.lat,p.lng);
    if(r>0 && p.d>r && !q) continue;
    out.push(p);
  }
  out.sort(function(a,b){ return a.d-b.d; });
  return out;
}

function refresh(keepView){
  if(!ready) return;
  var list=currentList();

  clusterer.clear();
  clusterer.addMarkers(list.map(function(p){ return p._m; }));

  if(!areaCircle){
    areaCircle=new kakao.maps.Circle({center:new kakao.maps.LatLng(state.center.lat,state.center.lng),
      radius:state.radius||0,strokeWeight:1,strokeColor:"#2b7fff",strokeOpacity:.45,
      fillColor:"#2b7fff",fillOpacity:.05});
  }
  if(state.radius>0){
    areaCircle.setPosition(new kakao.maps.LatLng(state.center.lat,state.center.lng));
    areaCircle.setRadius(state.radius);
    areaCircle.setMap(map);
  }else{
    areaCircle.setMap(null);
  }

  var cnt=document.getElementById("cnt");
  var hint=document.getElementById("hint");
  cnt.textContent = list.length.toLocaleString("ko-KR")+"곳";
  hint.textContent = state.q ? "‘"+state.q+"’ 검색 결과"
    : (state.radius>0 ? (state.me?"현위치":"지도 중심")+" 반경 "+(state.radius/1000)+"km · 가까운 순" : "서울 전체 · 가까운 순");

  var el=document.getElementById("list");
  if(!list.length){
    el.innerHTML='<div class="empty">조건에 맞는 곳이 없어요.<br>반경을 넓히거나 카테고리를 켜보세요.</div>';
    return;
  }
  var html=[], n=Math.min(list.length,300);
  for(var i=0;i<n;i++){
    var p=list[i], c=CATS[p.k];
    var meta = p.k==="lotto"
      ? "1등 "+p.win+"회 · 최근 "+p.last+"회차"
      : (p.user?("★ "+p.user.toFixed(1)+" · "):"")+(p.cat||"");
    html.push(
      '<div class="item" data-id="'+p.id+'">'
      +'<div class="pin '+c.css+'">'+c.icon+'</div>'
      +'<div class="itx"><div class="nm">'+esc(p.name)+'</div>'
      +'<div class="sub">'+esc(p.addr)+'</div>'
      +'<div class="meta">'+esc(c.label)+' · '+esc(meta)+'</div></div>'
      +'<div class="dist">'+fmtD(p.d)+'</div></div>'
    );
  }
  if(list.length>n) html.push('<div class="empty">가까운 '+n+'곳만 표시했어요. 검색이나 반경으로 좁혀보세요.</div>');
  html.push(CREDITS);
  el.innerHTML=html.join("");
  el.scrollTop=0;
}

document.getElementById("list").addEventListener("click",function(e){
  var it=e.target.closest(".item"); if(!it) return;
  var p=PLACES[+it.dataset.id];
  select(p,false);
  map.panTo(new kakao.maps.LatLng(p.lat,p.lng));
  if(sheet.dataset.state==="full") sheet.dataset.state="half";
});

var CREDITS='<div class="credits">'
 +'<b>데이터 출처</b><br>'
 +'· 수요미식회 / 생활의 달인 / 스페셜티 카페 — 다이닝코드(diningcode.com) 서울 지역 수록 업소<br>'
 +'· 로또 명당 — 동행복권 당첨 판매점 조회, 1~1242회 1등 배출 집계(서울·2회 이상)<br>'
 +'폐업·이전이 반영되지 않았을 수 있습니다. 방문 전 확인하세요.</div>';

/* ====== 상세 ====== */
function select(p,fromMarker){
  state.selected=p;
  var c=CATS[p.k];
  var d=document.getElementById("detail");
  var b=document.getElementById("dbadge");
  b.textContent=c.label; b.style.background=c.color;
  document.getElementById("dname").textContent=p.name;
  document.getElementById("daddr").textContent=p.addr;
  var meta;
  if(p.k==="lotto"){
    meta="1등 "+p.win+"회 배출 · 최근 "+p.last+"회차";
  }else{
    meta=(p.cat||"")+(p.user?"  ·  이용자 평점 ★"+p.user.toFixed(1):"");
  }
  if(p.d!=null) meta += "  ·  "+fmtD(p.d);
  document.getElementById("dmeta").textContent=meta;

  var acts=[];
  acts.push('<a class="act" target="_blank" rel="noopener" href="https://map.kakao.com/link/to/'
    +encodeURIComponent(p.name)+','+p.lat+','+p.lng+'">길찾기</a>');
  acts.push('<a class="act" target="_blank" rel="noopener" href="https://map.kakao.com/link/search/'
    +encodeURIComponent(p.name+" "+p.gu)+'">카카오맵</a>');
  if(p.tel) acts.push('<a class="act" href="tel:'+p.tel.replace(/[^0-9+]/g,"")+'">'+esc(p.tel)+'</a>');
  if(p.rid) acts.push('<a class="act" target="_blank" rel="noopener" href="https://www.diningcode.com/profile.php?rid='
    +encodeURIComponent(p.rid)+'">다이닝코드</a>');
  document.getElementById("dacts").innerHTML=acts.join("");
  d.classList.add("show");
  if(fromMarker && sheet.dataset.state==="full") sheet.dataset.state="half";
}
document.getElementById("dclose").addEventListener("click",function(){
  document.getElementById("detail").classList.remove("show");
});

/* ====== 부팅 ====== */
function boot(key){
  var s=document.createElement("script");
  s.src="https://dapi.kakao.com/v2/maps/sdk.js?appkey="+encodeURIComponent(key)+"&libraries=clusterer&autoload=false";
  s.onload=function(){ kakao.maps.load(initMap); };
  s.onerror=function(){ toast("카카오맵을 불러오지 못했어요. 키와 도메인 등록을 확인해 주세요"); showSetup(); };
  document.head.appendChild(s);
}
function showSetup(){ document.getElementById("setup").classList.add("show"); }

document.getElementById("keysave").addEventListener("click",function(){
  var v=document.getElementById("keyin").value.trim();
  if(!v){ toast("키를 입력해 주세요"); return; }
  LS.set("nb4_key",v);
  location.reload();
});

var key = KAKAO_KEY || LS.get("nb4_key","");
if(key) boot(key); else showSetup();

})();
</script>
